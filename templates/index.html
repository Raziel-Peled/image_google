<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנתח תמונות - ג'מיני AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .file-input-wrapper { margin-bottom: 20px; }
        input[type="file"] { font-size: 16px; margin-bottom: 10px; }
        button { padding: 12px 24px; font-size: 16px; background-color: #34a853; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s;}
        button:hover { background-color: #2b8c45; }
        #preview { margin-top: 20px; max-width: 100%; max-height: 300px; border-radius: 8px; display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #result { margin-top: 25px; padding: 15px; background-color: #e8f0fe; border-radius: 8px; display: none; line-height: 1.6; text-align: right; }
        .loader { display: none; margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>מנתח תמונות חכם 👁️</h1>
        <p>העלה תמונה והבינה המלאכותית תתאר לך מה מופיע בה.</p>
        
        <div class="file-input-wrapper">
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
        </div>
        
        <!-- תצוגה מקדימה של התמונה -->
        <img id="preview" alt="תצוגה מקדימה">
        <br>
        
        <button onclick="analyzeImage()">נתח את התמונה</button>
        
        <div class="loader" id="loader">הבינה המלאכותית מתבוננת בתמונה... ⏳</div>
        <div id="result"></div>
    </div>

    <script>
        // פונקציה להצגת התמונה על המסך לפני השליחה
        function previewImage() {
            const file = document.getElementById('imageInput').files[0];
            const preview = document.getElementById('preview');
            
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'inline-block';
            }
        }

        async function analyzeImage() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            
            if (fileInput.files.length === 0) {
                alert("אנא בחר תמונה קודם");
                return;
            }

            // הכנת התמונה לשליחה לשרת כטופס נתונים (FormData)
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            // איפוס תצוגה
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                // שליחה לשרת הפייתון שלנו
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                loader.style.display = 'none';

                if (data.description) {
                    resultDiv.innerHTML = `<strong>ניתוח התמונה:</strong><br>${data.description}`;
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.innerHTML = `<span style="color: red;">שגיאה: ${data.error}</span>`;
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                loader.style.display = 'none';
                resultDiv.innerHTML = `<span style="color: red;">שגיאה בתקשורת עם השרת.</span>`;
                resultDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
